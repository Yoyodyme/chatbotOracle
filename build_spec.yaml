version: 0.1
component: build
timeoutInSeconds: 600
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm-java22
    DOCKER_REGISTRY: "mx-queretaro-1.ocir.io/axx2gmncrzyo/yoyodyme/mavyk"

  exportedVariables:
    - BuildServiceDemoVersion

steps:
  - type: Command
    name: "Install GraalVM 22.x for Java22"
    command: yum -y install graalvm-22-jdk.x86_64;
             ls /usr/lib64/graalvm/

  - type: Command
    name: "Set PATH Variable"
    command: export PATH=$JAVA_HOME/bin:$PATH

  - type: Command
    name: "Docker Login"
    command: cd MtdrSpring;
             oci os object get --bucket-name "yoyodyme-mavyk" --name deployment_config.tgz --output-file deployment_config.tgz;
             tar -xzvf deployment_config.tgz;
             source env.sh;
             docker login mx-queretaro-1.ocir.io -u "axx2gmncrzyo/a00838956@tec.mx" -p "$(cat at.cfg)"

  - type: Command
    name: "Build"
    command: cd MtdrSpring;
             source env.sh;
             (cd backend; source build.sh)
