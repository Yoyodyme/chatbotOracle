name: Maven Build & Test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Clean frontend cache
        run: rm -rf MtdrSpring/backend/src/main/frontend/node_modules MtdrSpring/backend/src/main/frontend/package-lock.json
      - name: Build and test
        run: cd MtdrSpring/backend && ./mvnw clean verify "-Dtest=!TelegramE2ETest" -DfailIfNoTests=false
