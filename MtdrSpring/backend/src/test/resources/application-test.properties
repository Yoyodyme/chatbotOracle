# =============================================================================
# application-test.properties — perfil activo: test
# Se carga ENCIMA de application.properties cuando se ejecuta con
# @ActiveProfiles("test") o -Dspring.profiles.active=test
# =============================================================================

# ---------------------------------------------------------------------------
# Bot de Telegram — DESHABILITADO en el proceso de prueba
# El bot real debe correr en otro proceso/pod apuntando a la misma BD.
# Si se dejara en true, habría dos consumers de long-polling con el mismo
# token y uno de ellos recibiría errores 409 de Telegram.
# ---------------------------------------------------------------------------
TELEGRAM_BOT_ENABLED=false
server.port=8081

# ---------------------------------------------------------------------------
# Chat ID personal del tester (obtenlo hablando con @userinfobot en Telegram)
# Reemplaza el valor de abajo por tu chat_id real antes de ejecutar las pruebas.
# ---------------------------------------------------------------------------
TEST_CHAT_ID=7967344809

# ---------------------------------------------------------------------------
# Spring Security — credenciales de prueba locales
# Sobreescribe la variable de entorno SPRING_ADMIN_PASSWORD para el contexto
# de prueba y evita que el contexto falle por falta del env var.
# ---------------------------------------------------------------------------
SPRING_ADMIN_PASSWORD=admin_test_e2e_123

# ---------------------------------------------------------------------------
# JPA / Hibernate — misma BD Oracle ADB de siempre; sólo se desactiva el DDL
# automático para no alterar el esquema durante las pruebas.
# Comenta la línea de abajo si quieres que Hibernate siga en modo 'update'.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate

# ---------------------------------------------------------------------------
# Logging — reducir ruido durante las pruebas
# ---------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.springboot.MyTodoList=INFO
