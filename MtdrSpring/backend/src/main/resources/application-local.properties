# SSL Configuration for HTTPS — local development only.
# keystore.p12 is gitignored and generated locally; it does not exist in
# deployed images, where TLS is terminated at the OCI Load Balancer instead.
# SSL_KEYSTORE_PASSWORD must be set in environment — see .env.example
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
