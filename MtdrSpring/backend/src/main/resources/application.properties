# ============================================================================
# ORACLE DATABASE CONFIGURATION (ADB - Autonomous Database)
# Credentials read from environment variables — see .env.example
# ============================================================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

## Logging Properties
logging.level.root=info
logging.file.name=logs.log
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

## Spring Security
## SPRING_ADMIN_USER / SPRING_ADMIN_PASSWORD must be defined as environment variables
spring.security.user.name=${SPRING_ADMIN_USER:admin}
spring.security.user.password=${SPRING_ADMIN_PASSWORD}

## Telegram Bot Configuration
## TELEGRAM_BOT_TOKEN must be defined as an environment variable
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.name=${TELEGRAM_BOT_NAME:Eq51_bot}
## Enable/disable bot long-polling (useful when two developers
## share the same token — only one can consume updates at a time).
## Set TELEGRAM_BOT_ENABLED=false in your .env to disable it.
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:true}

## Artificial Intelligence Configuration (DeepSeek)
## DEEPSEEK_API_KEY must be defined as an environment variable
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions

## AI Agent Orchestrator Configuration
agent.ai.habilitado=${AGENT_AI_ENABLED:true}
agent.ai.api-key=${DEEPSEEK_API_KEY:}
agent.ai.api-url=https://api.deepseek.com/v1/chat/completions
agent.ai.modelo=${DEEPSEEK_MODEL:deepseek-chat}
