spring.profiles.active=local

# ============================================================================
# ORACLE DATABASE CONFIGURATION (ADB - Autonomous Database)
# Credentials read from environment variables — see .env.example
# ============================================================================
# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
## --- CONFIGURACIÓN PRODUCCIÓN (Oracle ADB) ---
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Explicitly target the EQUIPO51 schema so Hibernate always reads/writes the
# correct tables regardless of which Oracle user runs the admin console.
# Mirrors the JDBC user set in OracleConfiguration — both must be EQUIPO51.
spring.jpa.properties.hibernate.default_schema=${ORACLE_DB_USERNAME:EQUIPO51}

## Logging Properties
logging.level.root=info
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

## Spring Security
## SPRING_ADMIN_USER / SPRING_ADMIN_PASSWORD must be defined as environment variables
spring.security.user.name=${SPRING_ADMIN_USER:admin}
# CHANGED 2026-06-09: added ':changeme' default so app starts without SPRING_ADMIN_PASSWORD env var set
spring.security.user.password=${SPRING_ADMIN_PASSWORD:changeme}

## Telegram Bot Configuration
## TELEGRAM_BOT_TOKEN must be defined as an environment variable
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.name=${TELEGRAM_BOT_NAME:Eq51_bot}
## Enable/disable bot long-polling. Defaults to false so the bot does not
## start unless you explicitly set TELEGRAM_BOT_ENABLED=true in your .env.
## Only one process can consume the same token at a time (long-polling limit).
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}

## Artificial Intelligence Configuration (DeepSeek)
## DEEPSEEK_API_KEY must be defined as an environment variable
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions

## AI Agent Orchestrator Configuration
agent.ai.habilitado=${AGENT_AI_ENABLED:true}
agent.ai.api-key=${DEEPSEEK_API_KEY:}
agent.ai.api-url=https://api.deepseek.com/v1/chat/completions
agent.ai.modelo=${DEEPSEEK_MODEL:deepseek-chat}

# SSL Configuration for HTTPS
# SSL_KEYSTORE_PASSWORD must be set in environment — see .env.example
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.port=8080

# Local JWT signing secret — must be >= 32 characters. Override in prod via LOCAL_JWT_SECRET env var.
app.jwt.secret=${LOCAL_JWT_SECRET:local-dev-secret-change-in-production!}
