# OAuth2 Resource Server — JWT validation via OCI IAM JWKS endpoint.
# Using jwk-set-uri directly instead of issuer-uri because OCI tokens carry
# iss=https://identity.oraclecloud.com/ (global), not the tenant URL — the two
# would never match if issuer-uri were used.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://idcs-51b2f6e16d974aedba8f49fa2dce9503.identity.oraclecloud.com:443/oauth2/v1/keys

# SSL is terminated at the OCI Load Balancer — Spring Boot runs plain HTTP internally.
# Overrides the keystore.p12 config in application.properties which is only for local HTTPS.
server.ssl.enabled=false
server.port=8080

