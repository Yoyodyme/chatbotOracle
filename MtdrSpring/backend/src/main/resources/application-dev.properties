# ============================================================================
# PERFIL DEV — H2 en memoria (sin Oracle Wallet requerido)
# ============================================================================

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (para debugging local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=info
logging.level.com.springboot=debug
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

# Telegram Bot — leer desde variable de entorno
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.name=${TELEGRAM_BOT_NAME:Eq51_bot}

# LLM local — Groq API
# Token: variable de entorno GROQ_API_KEY
deepseek.api.key=${GROQ_API_KEY:}
deepseek.api.url=https://api.groq.com/openai/v1/chat/completions
agent.ai.api-key=${GROQ_API_KEY:}
agent.ai.api-url=https://api.groq.com/openai/v1/chat/completions
agent.ai.modelo=llama-3.3-70b-versatile
